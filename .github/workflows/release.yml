name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: npm run dist:win
          - os: macos-latest
            script: npm run dist:mac
          - os: ubuntu-latest
            script: npm run dist:linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: ${{ matrix.script }} -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # electron-builder creates the GitHub release as a draft, with no
      # description, and only auto-publishes it when a single process builds
      # every platform. Since our three platforms run as separate parallel
      # jobs above, none of them individually finalizes it, so we un-draft it
      # here — and always generate a description (a "What's Changed" summary
      # of everything merged since the previous release) at the same time,
      # since nothing else sets one.
      #
      # A draft release only has its tag_name set as a display field — the
      # underlying git tag ref isn't created until the release is actually
      # published, and creating that ref is itself a race between the three
      # parallel `build` jobs above (each running `--publish always`), which
      # can leave the tag ref missing entirely even though the draft release
      # exists. So the release is looked up via the general releases list
      # (which includes drafts, tag ref or not) rather than the tag-specific
      # lookup endpoint (which 404s until a real tag ref exists) — PATCHing
      # draft=false is what actually creates the tag ref, from target_commitish.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          REPO="${{ github.repository }}"
          RELEASE_ID=$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.tag_name == \"v$VERSION\") | .id" | head -n1)
          if [ -z "$RELEASE_ID" ]; then
            echo "::error::No draft release found with tag_name v$VERSION"
            exit 1
          fi
          gh api "repos/$REPO/releases/$RELEASE_ID" -X PATCH \
            -F draft=false \
            -F generate_release_notes=true
